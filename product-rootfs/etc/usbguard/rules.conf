# Saman OS USB device policy (usbguard).
# Everyday device classes are welcome; the classic BadUSB tricks —
# a "keyboard" that is really a network card, surprise ethernet or
# serial gadgets — are blocked. Manage with: usbguard list-devices.
allow with-interface equals { 03:*:* }
allow with-interface equals { 08:*:* }
allow with-interface equals { 01:*:* }
allow with-interface equals { 0e:*:* }
allow with-interface equals { ff:*:* }
block with-interface equals { 02:*:* }
block with-interface equals { 0a:*:* }
