#!/usr/sbin/nft -f
# Saman OS desktop firewall baseline: deny unsolicited inbound,
# allow everything outbound and established return traffic.
# (The Server edition replaces this with the Ofogheamn policy.)
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
